services:
  # TrustAI Unified Web Service (React UI + FastAPI Multi-Agent Backend on a single domain)
  - type: web
    name: trustai-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-pro
      - key: CORS_ORIGINS
        value: "*"
